name: GitHub Experiments CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run hello experiment
        run: python experiments/01-hello-github/hello.py
      - name: Install test deps
        run: pip install pytest
      - name: Run tests
        run: python -m pytest experiments/01-hello-github/test_hello.py -v
